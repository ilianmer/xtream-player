name: Captures d'écran

# Captures automatiques de l'appli sur un émulateur Android TV, avec un faux serveur Xtream.
# Seulement sur la branche « design » : rien n'est publié dans l'appli.
on:
  push:
    branches: [design]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler (version de test)
        env:
          ALL_ABIS: "1"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Résumer les erreurs
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|AAPT|resource .* not found' build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Vidéo de test et faux serveur
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null 2>&1 || true
          pip install -q pillow || true
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=25 -f lavfi -i sine=frequency=330:sample_rate=48000 \
            -t 30 -c:v libx264 -preset veryfast -b:v 5M -pix_fmt yuv420p -c:a aac -b:a 128k -f mpegts /tmp/test.ts || true
          nohup python3 tools/fake_xtream.py 8080 /tmp/test.ts > /tmp/fake.log 2>&1 &
          sleep 2
          curl -s "http://127.0.0.1:8080/player_api.php?username=demo&password=demo" | head -c 200
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android TV et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tools/screens.sh
      - name: Publier les captures (branche screens)
        if: always()
        run: |
          mkdir -p shots /tmp/pub
          cp /tmp/fake.log shots/fake.log 2>/dev/null || true
          cp -r shots/. /tmp/pub/
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git checkout -q --orphan screens-out
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          cp -r /tmp/pub/. .
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git add -A
          git commit -qm "Captures ${GITHUB_SHA::7}"
          git push -fq origin HEAD:screens
