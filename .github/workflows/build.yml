name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk XtreamPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XtreamPlayer-apk
          path: XtreamPlayer.apk
      # Publie l'APK à une adresse fixe :
      # https://github.com/ilianmer/xtream-player/releases/latest/download/XtreamPlayer.apk
      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Xtream Player (version ${{ github.run_number }})
          body: Installe ou mets à jour avec l'appli Downloader sur le stick.
          files: XtreamPlayer.apk
          make_latest: "true"
