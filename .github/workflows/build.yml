name: Build APK

on:
  push:
    branches-ignore: [design, screens]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Clé de signature fixe (chiffrée dans le dépôt). Sans le secret, on n'envoie surtout pas
      # une version signée avec une autre clé : elle refuserait de s'installer par-dessus.
      - name: Préparer la clé de signature
        env:
          RAW_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Espaces ou retour à la ligne collés avec le mot de passe : on les enlève.
          PW="$(printf %s "$RAW_PASSWORD" | tr -d '[:space:]')"
          echo "::add-mask::$PW"
          if [ -z "$PW" ]; then
            echo "::error::Secret SIGNING_PASSWORD manquant : GitHub > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          if ! PW="$PW" openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -in signing/release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass env:PW; then
            # Diagnostic sans révéler le mot de passe : longueur et début de son empreinte
            echo "::error::Mot de passe refusé (longueur ${#PW}, attendu 28 ; empreinte $(printf %s "$PW" | sha256sum | cut -c1-6), attendu d8b2fd)"
            exit 1
          fi
          echo "SIGNING_STORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log
      - name: Résumer les erreurs
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|AAPT|resource .* not found' build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk XtreamPlayer.apk
      # Garde-fou : on ne publie que des APK signés avec la clé fixe
      - name: Vérifier la signature
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$AS" verify --print-certs XtreamPlayer.apk | tee sig.txt
          grep -qi "bfa8ac77d0e56955af0d554d8a1d9f0c539a36648bd9d5aeb6f145e538eb9cac" sig.txt \
            || { echo "::error::L'APK n'est pas signé avec la clé fixe"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: XtreamPlayer-apk
          path: XtreamPlayer.apk
      # Publie l'APK à une adresse fixe :
      # https://github.com/ilianmer/xtream-player/releases/latest/download/XtreamPlayer.apk
      # Notes affichées dans l'appli : le message du commit, sans les lignes de signature
      - name: Préparer les notes
        if: github.ref == 'refs/heads/main'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$MSG" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' > notes.md || true
      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Xtream Player (version ${{ github.run_number }})
          body_path: notes.md
          files: XtreamPlayer.apk
          make_latest: "true"
